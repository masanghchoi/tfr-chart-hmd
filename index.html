<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Total Fertility Rate by Country</title>
<style>
  :root {
    --ink: #1a1a2e;
    --muted: #9aa0ab;
    --grid: #e8e8ee;
    --bg: #ffffff;
    --grey-line: #d8dae0;
    --grey-label: #b4b8c0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 24px 48px; }
  header { margin-bottom: 6px; }
  h1 {
    font-size: 22px; font-weight: 650; letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .sub {
    font-size: 13px; color: var(--muted); margin: 0 0 2px;
    line-height: 1.5;
  }
  .hint { font-size: 12.5px; color: var(--muted); }
  .hint b { color: var(--ink); font-weight: 600; }
  .toolbar {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    margin: 14px 0 8px;
  }
  .btn {
    font: inherit; font-size: 12px; font-weight: 500;
    color: var(--ink); background: #f4f5f8;
    border: 1px solid #e2e4ea; border-radius: 7px;
    padding: 6px 12px; cursor: pointer;
    transition: background .12s, border-color .12s;
  }
  .btn:hover { background: #ebedf2; }
  .btn:active { background: #e2e4ea; }
  .selected-tag {
    font-size: 12.5px; color: var(--muted);
  }
  .selected-tag b { font-weight: 650; }
  .chart-area { position: relative; width: 100%; }
  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .gridline { stroke: var(--grid); stroke-width: 1; }
  .axis-text { fill: var(--muted); font-size: 11px; }
  .axis-title { fill: var(--muted); font-size: 12px; font-weight: 500; }
  .series-path {
    fill: none; stroke-width: 1.4;
    cursor: pointer;
    transition: stroke .18s, stroke-width .18s, opacity .18s;
  }
  .country-label {
    font-size: 10.5px; cursor: pointer;
    transition: fill .18s, font-weight .18s, font-size .18s;
    dominant-baseline: middle;
  }
  .country-label:hover { font-weight: 700; }
  .dimmed { stroke: var(--grey-line) !important; opacity: .55; }
  .dimmed-label { fill: var(--grey-label) !important; font-weight: 400 !important; }
  .focus-path { stroke-width: 2.6 !important; opacity: 1 !important; }
  .focus-label { font-weight: 750 !important; font-size: 11.5px !important; }
  .tooltip {
    position: absolute; pointer-events: none;
    background: var(--ink); color: #fff;
    font-size: 11.5px; padding: 5px 9px; border-radius: 6px;
    opacity: 0; transition: opacity .1s; white-space: nowrap;
    transform: translate(-50%, -130%); z-index: 5;
  }
  .tooltip b { font-weight: 650; }
  @media (max-width: 640px) {
    .wrap { padding: 18px 14px 32px; }
    h1 { font-size: 18px; }
  }
</style>
</head>

  </header>

</div>

const SERIES = PAYLOAD.series;
const COLORS = PAYLOAD.colors;

const svg = document.getElementById('chart');
const tip = document.getElementById('tip');
const NS = 'http://www.w3.org/2000/svg';

// layout
const W = 1120, H = 660;
const M = { top: 24, right: 86, bottom: 46, left: 46 };
const plotW = W - M.left - M.right;
const plotH = H - M.top - M.bottom;

// domain
let yearMin = Infinity, yearMax = -Infinity, tfrMin = Infinity, tfrMax = -Infinity;
for (const c in SERIES) {
  for (const [yr, v] of SERIES[c]) {
    if (yr < yearMin) yearMin = yr;
    if (yr > yearMax) yearMax = yr;
    if (v < tfrMin) tfrMin = v;
    if (v > tfrMax) tfrMax = v;
  }
}
// pad y a touch
const yLo = Math.floor(tfrMin*10)/10;
const yHi = Math.ceil(tfrMax*10)/10;

const xScale = yr => M.left + (yr - yearMin) / (yearMax - yearMin) * plotW;
const yScale = v => M.top + (yHi - v) / (yHi - yLo) * plotH;

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

// gridlines + axes
const gGrid = el('g', {});
svg.appendChild(gGrid);

// y gridlines at integer + .5 steps
const yTicks = [];
for (let t = Math.ceil(yLo); t <= yHi; t += 1) yTicks.push(t);
yTicks.forEach(t => {
  const y = yScale(t);
  gGrid.appendChild(el('line', { x1: M.left, y1: y, x2: M.left+plotW, y2: y, class: 'gridline' }));
  const lab = el('text', { x: M.left-8, y: y+3, class: 'axis-text', 'text-anchor': 'end' });
  lab.textContent = t;
  gGrid.appendChild(lab);
});

// x gridlines every 25 years near round numbers
const xTicks = [];
for (let t = Math.ceil(yearMin/25)*25; t <= yearMax; t += 25) xTicks.push(t);
xTicks.forEach(t => {
  const x = xScale(t);
  gGrid.appendChild(el('line', { x1: x, y1: M.top, x2: x, y2: M.top+plotH, class: 'gridline' }));
  const lab = el('text', { x: x, y: M.top+plotH+22, class: 'axis-text', 'text-anchor': 'middle' });
  lab.textContent = t;
  gGrid.appendChild(lab);
});

// axis titles
const xt = el('text', { x: M.left+plotW/2, y: H-6, class: 'axis-title', 'text-anchor': 'middle' });
xt.textContent = 'Year';
svg.appendChild(xt);
const yt = el('text', { x: 14, y: M.top+plotH/2, class: 'axis-title', 'text-anchor': 'middle', transform: `rotate(-90 14 ${M.top+plotH/2})` });
yt.textContent = 'Children per woman';
svg.appendChild(yt);

// paths
const gPaths = el('g', {});
svg.appendChild(gPaths);
const gLabels = el('g', {});
svg.appendChild(gLabels);

const countries = Object.keys(SERIES).sort();
const pathEls = {}, labelEls = {};

function buildPath(pts) {
  return pts.map((p,i) => (i? 'L':'M') + xScale(p[0]).toFixed(1) + ' ' + yScale(p[1]).toFixed(1)).join(' ');
}

countries.forEach(c => {
  const p = el('path', { d: buildPath(SERIES[c]), class: 'series-path', stroke: COLORS[c], 'data-c': c });
  gPaths.appendChild(p);
  pathEls[c] = p;
});

// labels stacked on right, ordered by final TFR, spread across full y-range
const finals = countries.map(c => {
  const s = SERIES[c];
  return { c, last: s[s.length-1] };
}).sort((a,b) => a.last[1] - b.last[1]);

const labN = finals.length;
const labTop = M.top + 6, labBot = M.top + plotH - 6;
finals.forEach((f, i) => {
  const y = labBot - (labBot - labTop) * (i/(labN-1));
  const t = el('text', { x: M.left+plotW+10, y: y, class: 'country-label', fill: COLORS[f.c], 'data-c': f.c });
  t.textContent = f.c;
  gLabels.appendChild(t);
  labelEls[f.c] = t;
});

// interaction
let focused = null;

function setFocus(c) {
  focused = c;
  const selTag = document.getElementById('selTag');
  countries.forEach(k => {
    const isF = (c === null) || (k === c);
    pathEls[k].classList.toggle('dimmed', c !== null && !isF);
    pathEls[k].classList.toggle('focus-path', c !== null && isF);
    labelEls[k].classList.toggle('dimmed-label', c !== null && !isF);
    labelEls[k].classList.toggle('focus-label', c !== null && isF);
  });
  if (c === null) {
    selTag.textContent = 'All countries shown';
  } else {
    const s = SERIES[c];
    selTag.innerHTML = `Showing <b style="color:${COLORS[c]}">${c}</b> &middot; final TFR ${s[s.length-1][1].toFixed(2)} (${s[s.length-1][0]})`;
  }
  // raise focused path
  if (c !== null) gPaths.appendChild(pathEls[c]);
}

function toggle(c) { setFocus(focused === c ? null : c); }

countries.forEach(c => {
  pathEls[c].addEventListener('click', e => { e.stopPropagation(); toggle(c); });
  labelEls[c].addEventListener('click', e => { e.stopPropagation(); toggle(c); });
  const hover = (on) => {
    if (focused) return;
    countries.forEach(k => {
      if (k !== c) {
        pathEls[k].classList.toggle('dimmed', on);
        labelEls[k].classList.toggle('dimmed-label', on);
      }
    });
    pathEls[c].classList.toggle('focus-path', on);
    labelEls[c].classList.toggle('focus-label', on);
    if (on) gPaths.appendChild(pathEls[c]);
  };
  pathEls[c].addEventListener('mouseenter', () => hover(true));
  pathEls[c].addEventListener('mouseleave', () => hover(false));
  labelEls[c].addEventListener('mouseenter', () => hover(true));
  labelEls[c].addEventListener('mouseleave', () => hover(false));
});

svg.addEventListener('click', () => setFocus(null));
document.getElementById('resetBtn').addEventListener('click', () => setFocus(null));

// tooltip: nearest point on focused/hovered path
const chartArea = document.querySelector('.chart-area');
svg.addEventListener('mousemove', e => {
  const active = focused;
  if (!active) { tip.style.opacity = 0; return; }
  const rect = svg.getBoundingClientRect();
  const sx = (e.clientX - rect.left) / rect.width * W;
  // invert x to year
  const yr = Math.round(yearMin + (sx - M.left)/plotW * (yearMax - yearMin));
  const s = SERIES[active];
  let best = null, bd = Infinity;
  for (const p of s) { const d = Math.abs(p[0]-yr); if (d<bd){bd=d;best=p;} }
  if (!best || bd > 5) { tip.style.opacity = 0; return; }
  const px = xScale(best[0]) / W * rect.width;
  const py = yScale(best[1]) / H * rect.height;
  tip.style.left = px + 'px';
  tip.style.top = py + 'px';
  tip.innerHTML = `<b>${active}</b> ${best[0]} &middot; ${best[1].toFixed(2)}`;
  tip.style.opacity = 1;
});
svg.addEventListener('mouseleave', () => { tip.style.opacity = 0; });
</script>
